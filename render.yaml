services:
  - type: web
    name: chatbot-gd1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: GRADIO_SERVER_NAME=0.0.0.0 python app.py
    envVars:
      - key: LLM_BASE_URL
        sync: false # đặt trong Render Dashboard → Environment
      - key: LLM_API_KEY
        sync: false # secret — KHÔNG commit
      - key: LLM_MODEL
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.3
